# Runs the test suite on Linux, Windows and macOS under every supported Python.
# It installs the test tools and nothing else; it publishes nothing and needs no secret.
# Actions are pinned to commits and the test tools to versions, so a run tests this repository and
# not whatever an action's tag or a tool's latest release points at that day.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1 hypothesis==6.168.3 jsonschema==4.26.0
      - run: python -m pytest -q
